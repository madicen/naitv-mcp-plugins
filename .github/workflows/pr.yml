name: pr

on:
  pull_request:
  push:
    branches: [main, "test/**"]

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Python deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install pytest pytest-cov
      - name: Catalog L1–L3
        run: |
          . .venv/bin/activate
          ./scripts/test_all.sh
      - name: Go helpers
        run: |
          (cd tools/structural-anchor/go_symbols && go test ./...)
          (cd tools/symbol-navigator/go_nav && go test ./...)
      - name: Harness unit + cross-plugin
        run: |
          . .venv/bin/activate
          python -m pytest testing/integration/test_manifest_layout.py testing/perf/tests testing/eval/tests -q
          python testing/integration/cross_plugin_check.py

  l4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Soft L4 via naitv-mcp
        # Best-effort: missing install OR L4 failures warn and exit 0 so catalog
        # remains the merge gate. Known gap: naitv-mcp@latest may not kill
        # exec tools within the declared timeout (slow_sleep probe).
        run: |
          set -euo pipefail
          go install github.com/madicen/naitv-mcp/cmd/naitv-mcp@latest || {
            echo "::warning::go install naitv-mcp failed; skipping L4"
            exit 0
          }
          export PATH="$(go env GOPATH)/bin:$PATH"
          if ! command -v naitv-mcp >/dev/null 2>&1; then
            echo "::warning::naitv-mcp not on PATH after install; skipping L4"
            exit 0
          fi
          python -m venv .venv
          . .venv/bin/activate
          pip install pytest pytest-cov
          failed=0
          RUN_L4=1 ./scripts/l4.sh structural-anchor || failed=1
          RUN_L4=1 ./scripts/l4.sh symbol-navigator || failed=1
          if [[ "$failed" -ne 0 ]]; then
            echo "::warning::L4 failed against naitv-mcp@latest (soft; catalog remains the merge gate)"
          fi
          exit 0
